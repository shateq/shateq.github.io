<!DOCTYPE html>
<html lang="{{.Site.Language.Locale}}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="canonical" href="{{.Permalink}}">
    <meta name="author" content="Szymon Wieczorek">
    <meta name="description" content="{{.Description}}">
    <title>{{ .Title }}</title>

    <meta property="og:title" content="swieczorek">
    <meta property="og:image" content="https://swieczorek.com/static/og.png">
    <meta property="og:url" content="{{.Site.BaseURL}}">
    <meta property="og:type" content="website">

    <meta name="google" content="notranslate">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lateef:wght@400;700&display=swap" rel="stylesheet">
    <link href="{{ (resources.Get "main.css").RelPermalink }}" rel="stylesheet" type="text/css">
  </head>
  <body>
    {{ block "main" . }}{{ end }}
  </body>
</html>
