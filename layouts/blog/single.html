{{define "main"}}
<article>
  <div class="title">
    {{ partial "return_rss.html" }}
    <h1>{{.Title}}</h1>
    published {{ partial "date.html" . }}
    {{ if and .Params.update (ne (.Params.update | time) .Date) }}
    <br><small>updated {{ (.Params.update | time).Format site.Params.dateFormat }}</small>
    {{ end }}
  </div>
  {{ partial "pad.html" }}
  <main>
    {{ .Content }}
  </main>
</article>
{{end}}
