{{ define "main" }}
<main>
  <span class="ar h1">مقالات</span>
  <div>
    <h1 class="title">{{ .Title }}</h1>
    {{ partial "return_rss.html" }}
    {{ partial "pad.html" }}
  </div>
  <h2 class="title">Latest posts</h2>
  <ul>
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ partial "date.html" . }}
    </li>
    {{ end }}
  </ul>
  {{ partial "pad.html" }}
  {{ partial "qr.html" }}
</main>
{{ end }}
