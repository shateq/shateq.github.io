{{ define "main" }}
<main>
  <span class="ar h1">مقالات</span>
  <div>
    <h1 class="title">{{ .Title }}</h1>
    {{ partial "return_rss.html" }}
    <span class="pad"></span>
  </div>
  <h2 class="title">Latest posts</h2>
  <ul>
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a><small>{{.Date.Format "2 Jan 2006"}}</small>
    </li>
    {{ end }}
  </ul>
  <span class="pad"></span>
  {{ partial "qr.html" }}
</main>
{{ end }}
